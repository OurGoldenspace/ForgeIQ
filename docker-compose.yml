services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: forgeiq
      POSTGRES_PASSWORD: forgeiq
      POSTGRES_DB: forgeiq
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seeds.sql:/docker-entrypoint-initdb.d/02_seeds.sql:ro

volumes:
  postgres_data:
